title: "clystere MultiQC Report"
subtitle: "Multi-Predictor Biosynthetic Gene Cluster, MAG QC, Novelty & Abundance Analysis"

report_comment: >
  This report has been generated by the <a href="https://github.com/andreassag/clystere" target="_blank">clystere</a>
  analysis pipeline.

report_section_order:
  clystere_genome_overview:
    order: -300
  clystere_consensus_support:
    order: -400
  clystere_region_counts:
    order: -500
  clystere_amp_summary:
    order: -550
  clystere_bgc_abundance:
    order: -600
  quast:
    order: -700
  checkm2:
    order: -750
  software_versions:
    order: -1000

export_plots: false

sp:
  software_versions:
    fn: "*versions.yml"
  clystere_region_counts:
    fn: "*region_counts.tsv"
  clystere_consensus_support:
    fn: "*consensus_support_mqc.tsv"
  clystere_genome_overview:
    fn: "*genome_overview_mqc.tsv"
  clystere_amp_summary:
    fn: "*amp_summary_mqc.tsv"
  clystere_bgc_abundance:
    fn: "*bgc_abundance_mqc.tsv"

custom_data:
  clystere_genome_overview:
    file_format: "tsv"
    plot_type: "table"
    section_name: "Genome QC, Taxonomy & BGC Overview"
    description: "Per-genome summary joining QUAST, CheckM2, GTDB-Tk, predictor BGC counts, consensus loci, novelty counts, and assembly-normalized BGC density."
  clystere_consensus_support:
    file_format: "tsv"
    plot_type: "bargraph"
    section_name: "Cross-Tool BGC Consensus Support"
    description: "Number of unified BGC loci per genome supported by 3-4 predictors (High), 2 predictors (Medium), or a single predictor."
  clystere_region_counts:
    file_format: "tsv"
    plot_type: "table"
    section_name: "antiSMASH BGC Counts per Genome"
    description: "Summary counts of detected antiSMASH biosynthetic gene cluster regions per genome or contig."
  clystere_amp_summary:
    file_format: "tsv"
    plot_type: "table"
    section_name: "Antimicrobial Peptide (AMP) Candidates"
    description: "Per-genome counts of antimicrobial peptide candidates identified by Macrel and summarized via AMPcombi."
  clystere_bgc_abundance:
    file_format: "tsv"
    plot_type: "table"
    section_name: "Metagenomic & Metatranscriptomic BGC Mapping Summary"
    description: "Per-sample read mapping summary across the non-redundant BGC catalog (detected BGCs, total TPM, and mean depth)."
