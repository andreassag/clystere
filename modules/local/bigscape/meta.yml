name: "bigscape"
description: Runs BiG-SCAPE v2 on unified BGC region directories with optional dereplication into representative gene cluster families (GCFs).
keywords:
  - biosynthetic gene clusters
  - bgc
  - clustering
  - bigscape
  - gcf
tools:
  - "bigscape":
      description: "Biosynthetic Gene Similarity Clustering and Prospecting Engine"
      homepage: "https://github.com/medema-group/BiG-SCAPE"
      documentation: "https://github.com/medema-group/BiG-SCAPE"
      doi: "10.1038/s41589-019-0400-9"
      licence:
        - "MIT"
input:
  - bgc_dirs:
      type: directory
      description: Collected directories containing BGC region GenBank files
  - pfam:
      type: file
      description: Path to Pfam-A.hmm file or directory containing Pfam-A.hmm
      pattern: "Pfam-A.hmm"
  - dereplicate:
      type: boolean
      description: Whether to run `bigscape dereplicate` before `bigscape cluster`
  - zip_output:
      type: boolean
      description: Whether to archive the `bigscape/` output directory as `bigscape.tar.gz`
output:
  dereplicate_dir:
    - bigscape_dereplicate/:
        type: directory
        description: Optional BiG-SCAPE dereplication output directory
        pattern: "bigscape_dereplicate/"
  db:
    - bigscape/bigscape.db:
        type: file
        description: BiG-SCAPE SQLite results database
        pattern: "bigscape/bigscape.db"
  results_dir:
    - bigscape/:
        type: directory
        description: BiG-SCAPE clustering output directory
        pattern: "bigscape/"
  archive:
    - bigscape.tar.gz:
        type: file
        description: Optional compressed archive of `bigscape/`
        pattern: "bigscape.tar.gz"
  versions_bigscape:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bigscape:
          type: string
          description: The name of the tool
      - "2.0.2":
          type: string
          description: The version of the tool
authors:
  - "@andreassag"
