name: "gunzip_gff"
description: Decompresses gzipped GFF3 files to plain-text GFF3 for antiSMASH.
keywords:
  - gff3
  - gunzip
tools:
  - "python":
      description: "Python 3 standard library gzip utility"
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - gff_in:
        type: file
        description: Input plain or gzipped GFF3 file
output:
  gff:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}.gff3":
          type: file
          description: Plain-text GFF3 file
          pattern: "*.gff3"
  versions_gunzip_gff:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python3 --version 2>&1 | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@andreassag"
