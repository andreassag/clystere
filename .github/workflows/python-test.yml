name: Python tests

on:
  push:
    branches: [main, develop]
    paths:
      - "bin/**"
      - "tests/python/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "bin/**"
      - "tests/python/**"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest tests/python/ -v --tb=short
