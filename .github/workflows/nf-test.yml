name: nf-test

on:
  push:
    branches: [main, develop]
    paths:
      - "bin/**"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "tests/**"
      - "nf-test.config"
      - "nextflow.config"
      - "conf/**"
      - ".github/workflows/nf-test.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "bin/**"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "tests/**"
      - "nf-test.config"
      - "nextflow.config"
      - "conf/**"
      - ".github/workflows/nf-test.yml"
      - ".github/actions/**"
  workflow_dispatch:

jobs:
  get-shards:
    name: Get nf-test shards
    runs-on: ubuntu-latest
    outputs:
      nextflow-version: ${{ steps.get-shards.outputs.nextflow-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/get-shards
        id: get-shards

  nf-test:
    name: nf-test suite (${{ matrix.nextflow-version }})
    needs: [get-shards]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version:
          - ${{ needs.get-shards.outputs.nextflow-version }}
          - latest-stable
    steps:
      - uses: actions/checkout@v7

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: "${{ matrix.nextflow-version }}"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v2
        with:
          version: "0.9.5"

      - name: Run nf-test
        run: nf-test test tests/ --profile docker --verbose

      - name: Upload nf-test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nf-test-logs-${{ matrix.nextflow-version }}
          path: .nf-test/
          retention-days: 7
